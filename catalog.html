<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>連線商品清單 - W.W.連線代購</title>
  <!-- Google Fonts & LINE LIFF SDK -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary: #06c755;
      --primary-dark: #059b43;
      --accent: #ff4757;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Outfit', 'Noto Sans TC', sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      padding-bottom: 90px;
    }

    /* 頂部 Header */
    .catalog-header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .brand-title {
      font-size: 17px;
      font-weight: 900;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .brand-badge {
      font-size: 11px;
      background: #eefbf3;
      color: var(--primary-dark);
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 700;
    }

    .btn-my-orders {
      display: flex;
      align-items: center;
      gap: 4px;
      background: #f1f5f9;
      color: #334155;
      border: 1px solid var(--border);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s;
    }

    .btn-my-orders:active {
      transform: scale(0.96);
      background: #e2e8f0;
    }

    /* 搜尋框 */
    .search-bar {
      position: relative;
      margin-bottom: 8px;
    }

    .search-input {
      width: 100%;
      padding: 9px 36px 9px 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #f8fafc;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-main);
    }

    .search-input:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 13px;
      opacity: 0.5;
      pointer-events: none;
    }

    .search-clear {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 13px;
      cursor: pointer;
      display: none;
      padding: 4px;
    }

    /* 商品網格容器 */
    .catalog-container {
      max-width: 900px;
      margin: 0 auto;
      padding: 14px;
    }

    .stats-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 640px) {
      .product-grid {
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
      }
    }

    /* 單一商品卡片 */
    .prod-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      text-decoration: none;
      color: inherit;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.03);
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .prod-card:active {
      transform: scale(0.98);
    }

    .prod-img-box {
      position: relative;
      width: 100%;
      padding-top: 100%; /* 1:1 正方形 */
      background: #f8fafc;
      overflow: hidden;
    }

    .prod-img-box img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #ffffff;
      transition: transform 0.3s;
    }

    .prod-card:hover .prod-img-box img {
      transform: scale(1.03);
    }

    .card-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 6px;
      letter-spacing: 0.3px;
    }

    .card-body {
      padding: 10px 12px 12px;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    .card-title {
      font-size: 13px;
      font-weight: 700;
      line-height: 1.4;
      height: 36px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      margin-bottom: 6px;
      color: var(--text-main);
    }

    .card-prices {
      margin-top: auto;
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
    }

    .card-current-price {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
      font-family: 'Outfit', sans-serif;
    }

    .card-original-price {
      font-size: 11px;
      color: #94a3b8;
      text-decoration: line-through;
    }

    .btn-buy-now {
      margin-top: 8px;
      width: 100%;
      padding: 7px;
      border-radius: 8px;
      background: #eefbf3;
      color: var(--primary-dark);
      border: 1px solid #86efac;
      font-size: 12px;
      font-weight: 700;
      text-align: center;
      transition: background 0.1s;
    }

    .prod-card:hover .btn-buy-now {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    /* 骨架屏載入動效 */
    .skeleton-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .skeleton-card {
      background: #fff;
      border-radius: var(--radius);
      height: 240px;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 1; }
    }

    /* 底部固定 Bar */
    .catalog-bottom-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 10px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 -4px 15px rgba(0, 0, 0, 0.05);
    }

    .bottom-user-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .bottom-avatar {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: #e2e8f0;
      object-fit: cover;
    }

    .bottom-btn-orders {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(6, 199, 85, 0.3);
    }
    .btn-buy-now.disabled {
      background: #94a3b8;
      box-shadow: none;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <!-- 頂部 Header -->
  <header class="catalog-header">
    <div class="header-top">
      <div class="brand-title">
        <span>🇯🇵🇰🇷 W.W.連線代購</span>
        <span class="brand-badge">2026.10月連線</span>
      </div>
      <a href="my-orders.html" class="btn-my-orders" id="topOrderBtn">
        <span>📦 訂購清單</span>
      </a>
    </div>

    <!-- 搜尋框 -->
    <div class="search-bar">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="搜尋商品名稱、編號 (如 J2609270001)..." oninput="handleSearch()">
      <button type="button" id="btnClearSearch" class="search-clear" onclick="clearSearch()">✕</button>
    </div>
  </header>

  <!-- 主內容區 -->
  <main class="catalog-container">
    <!-- 收單截止動態倒數晶片 -->
    <div id="catalogDeadlineBanner" style="display:none; align-items:center; justify-content:center; background:linear-gradient(135deg, #fef2f2 0%, #fff1f2 100%); border:1px solid #fecdd3; color:#e11d48; padding:8px 12px; border-radius:10px; font-size:12.5px; font-weight:700; margin-bottom:12px;">
      <span id="catalogDeadlineText"></span>
    </div>

    <div class="stats-bar">
      <span id="productCountText">正在載入商品清單...</span>
      <span style="font-size: 11px; color: #10b981;">● 即時連線ing</span>
    </div>

    <!-- 載入中骨架屏 -->
    <div id="skeletonLoader" class="skeleton-grid">
      <div class="skeleton-card" style="background:#e2e8f0;"></div>
      <div class="skeleton-card" style="background:#e2e8f0;"></div>
      <div class="skeleton-card" style="background:#e2e8f0;"></div>
      <div class="skeleton-card" style="background:#e2e8f0;"></div>
    </div>

    <!-- 商品網格 -->
    <div class="product-grid" id="productGrid" style="display: none;"></div>

    <!-- 查無商品提示 -->
    <div id="noResultBox" style="display: none; text-align: center; padding: 50px 16px; color: var(--text-muted);">
      <div style="font-size: 36px; margin-bottom: 8px;">🔍</div>
      <div style="font-weight: 700; font-size: 15px; color: var(--text-main);">查無符合的連線商品</div>
      <p style="font-size: 12px; margin-top: 4px;">請嘗試更換搜尋關鍵字（可搜尋商品名稱或編號）！</p>
      <button type="button" onclick="clearSearch()" style="margin-top: 14px; padding: 6px 16px; border-radius: 8px; border: none; background: #e2e8f0; color: #334155; font-weight: 700; font-size: 12px; cursor: pointer;">清空搜尋條件</button>
    </div>
  </main>

  <!-- 底部固定 Bar -->
  <div class="catalog-bottom-bar">
    <div class="bottom-user-info">
      <img id="userAvatar" class="bottom-avatar" src="https://via.placeholder.com/32" alt="">
      <div>
        <div style="font-size: 12px; font-weight: 700; color: var(--text-main);" id="userNameText">連線貴賓</div>
        <div style="font-size: 10px; color: var(--text-muted);">點擊商品即可火速登記</div>
      </div>
    </div>
    <a href="my-orders.html" class="bottom-btn-orders" id="bottomOrderBtn">
      📦 查看我的訂購清單
    </a>
  </div>

  <script>
    // ======= 核心設定 (請替換為賣家的 GAS 部署網址與 LIFF ID) =======
    const CONFIG = {
      LIFF_ID: '2011732923-rcjz7Igd',
      GAS_API_URL: 'https://script.google.com/macros/s/AKfycbzz5Upj-2ho-n6kdWqffD3a0B6xNki6FYjwrQP7RVDP9d41PALA-6JVZeeC1CnJn7ZG/exec'
    };

    let allProducts = [];
    let currentCategory = 'ALL';
    let searchKeyword = '';
    let currentUserId = '';

    window.onload = function() {
      // 0. 瞬間快取還原 (0 毫秒極速呈現上次畫面，消除等待白屏/骨架屏)
      restoreInstantCache();

      // 1. 雙軌並行發動 (LIFF 身分驗證 與 商品清單下載 同時出發，互不卡住)
      initLiff();
      fetchProducts();
    };

    // 0 毫秒快取恢復機制 (SWR 模式)
    function restoreInstantCache() {
      try {
        // A. 恢復買家資訊 (localStorage 優先)
        const cachedProfile = localStorage.getItem('liff_user_profile') || sessionStorage.getItem('liff_user_profile');
        if (cachedProfile) {
          const p = JSON.parse(cachedProfile);
          if (p.userId) currentUserId = p.userId;
          if (p.displayName) document.getElementById('userNameText').textContent = p.displayName;
          if (p.pictureUrl) document.getElementById('userAvatar').src = p.pictureUrl;
          updateOrderLinks();
        }

        // B. 恢復商品列表與收單狀態
        const cachedData = sessionStorage.getItem('cached_catalog_data');
        if (cachedData) {
          const parsed = JSON.parse(cachedData);
          if (parsed && Array.isArray(parsed.products) && parsed.products.length > 0) {
            allProducts = parsed.products;
            document.getElementById('skeletonLoader').style.display = 'none';
            if (parsed.settings) {
              initCatalogDeadline(parsed.settings.ORDER_DEADLINE);
              if (parsed.settings.STORE_NAME) {
                const brandElem = document.querySelector('.brand-title span:first-child');
                if (brandElem) brandElem.textContent = parsed.settings.STORE_NAME;
              }
            }
            renderProductList();
          }
        }
      } catch (e) {
        console.warn('快取還原略過:', e);
      }
    }

    function updateOrderLinks() {
      const params = new URLSearchParams();
      if (currentUserId && currentUserId !== 'TEST_USER_999') params.set('uid', currentUserId);
      const nameElem = document.getElementById('userNameText');
      if (nameElem && nameElem.textContent && nameElem.textContent !== '連線貴賓') {
        params.set('name', nameElem.textContent);
      }
      const avatarElem = document.getElementById('userAvatar');
      if (avatarElem && avatarElem.src && !avatarElem.src.includes('placeholder')) {
        params.set('avatar', avatarElem.src);
      }
      const queryStr = params.toString() ? `?${params.toString()}` : '';

      const topBtn = document.getElementById('topOrderBtn');
      const bottomBtn = document.getElementById('bottomOrderBtn');
      if (topBtn) topBtn.href = `my-orders.html${queryStr}`;
      if (bottomBtn) bottomBtn.href = `my-orders.html${queryStr}`;
    }

    // 初始化 LINE LIFF (背景非同步執行，不阻礙商品載入)
    async function initLiff() {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('uid')) {
        currentUserId = urlParams.get('uid');
        updateOrderLinks();
      }

      if (CONFIG.LIFF_ID && !CONFIG.LIFF_ID.includes('YOUR_LIFF')) {
        try {
          await liff.init({ liffId: CONFIG.LIFF_ID });
          if (liff.isLoggedIn()) {
            const profile = await liff.getProfile();
            currentUserId = profile.userId;
            document.getElementById('userNameText').textContent = profile.displayName || '連線貴賓';
            if (profile.pictureUrl) {
              document.getElementById('userAvatar').src = profile.pictureUrl;
            }
            // 存入雙快取供下次瞬間使用
            try {
              const profStr = JSON.stringify({
                userId: profile.userId,
                displayName: profile.displayName,
                pictureUrl: profile.pictureUrl
              });
              sessionStorage.setItem('liff_user_profile', profStr);
              localStorage.setItem('liff_user_profile', profStr);
            } catch (e) {}
            updateOrderLinks();
          }
        } catch (err) {
          console.warn('LIFF 初始化略過或非 LINE 瀏覽器環境:', err);
        }
      }
    }

    let catalogDeadlineDate = null;
    let catalogTimer = null;
    let isCatalogExpired = false;

    function initCatalogDeadline(deadlineStr) {
      if (catalogTimer) clearInterval(catalogTimer);
      catalogDeadlineDate = parseDeadline(deadlineStr);

      updateCatalogDeadlineUI();
      if (catalogDeadlineDate) {
        catalogTimer = setInterval(updateCatalogDeadlineUI, 1000);
      }
    }

    function parseDeadline(str) {
      if (!str || !String(str).trim()) return null;
      const s = String(str).trim().replace(/-/g, '/');
      const d = new Date(s);
      if (!isNaN(d.getTime())) return d;
      const m = s.match(/^(\d{4})\/(\d{1,2})\/(\d{1,2})\s+(\d{1,2}):(\d{1,2})/);
      if (m) {
        return new Date(Number(m[1]), Number(m[2]) - 1, Number(m[3]), Number(m[4]), Number(m[5]), 0);
      }
      return null;
    }

    function updateCatalogDeadlineUI() {
      const banner = document.getElementById('catalogDeadlineBanner');
      const textElem = document.getElementById('catalogDeadlineText');
      if (!banner || !textElem) return;

      // 若未指定截止時間，視為目前無時間限制，自動隱藏倒數條，維持常態開放下單
      if (!catalogDeadlineDate) {
        banner.style.display = 'none';
        if (isCatalogExpired) {
          isCatalogExpired = false;
          renderProductList();
        }
        return;
      }

      banner.style.display = 'flex';
      const now = new Date();

      if (now >= catalogDeadlineDate) {
        if (!isCatalogExpired) {
          isCatalogExpired = true;
          renderProductList();
        }
        textElem.textContent = '⛔ 本次連線已收單';
      } else {
        if (isCatalogExpired) {
          isCatalogExpired = false;
          renderProductList();
        }
        const diffMs = Math.max(0, catalogDeadlineDate - now);
        const days = Math.floor(diffMs / (1000 * 60 * 60 * 24));
        const hours = Math.floor((diffMs % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
        const mins = Math.floor((diffMs % (1000 * 60 * 60)) / (1000 * 60));
        const secs = Math.floor((diffMs % (1000 * 60)) / 1000);

        let timeStr = '';
        if (days > 0) timeStr += `${days}天 `;
        timeStr += `${String(hours).padStart(2, '0')}小時 ${String(mins).padStart(2, '0')}分 ${String(secs).padStart(2, '0')}秒`;
        textElem.textContent = `⏳ 本次連線收單倒數：${timeStr}`;
      }
    }

    // 載入商品資料 (雙軌並行請求極速完成，100% 確保拿到 settings)
    async function fetchProducts() {
      try {
        const [prodRes, settRes] = await Promise.allSettled([
          fetch(`${CONFIG.GAS_API_URL}?action=getProducts`).then(r => r.json()),
          fetch(`${CONFIG.GAS_API_URL}?action=getSettings`).then(r => r.json())
        ]);

        document.getElementById('skeletonLoader').style.display = 'none';

        // 1. 處理設定 (收單截止日與商店名稱)
        let sett = {};
        if (settRes.status === 'fulfilled' && settRes.value && settRes.value.success && settRes.value.data) {
          sett = settRes.value.data;
        } else if (prodRes.status === 'fulfilled' && prodRes.value && prodRes.value.settings) {
          sett = prodRes.value.settings;
        }

        if (sett.ORDER_DEADLINE !== undefined) {
          initCatalogDeadline(sett.ORDER_DEADLINE);
        } else {
          initCatalogDeadline(null);
        }

        if (sett.STORE_NAME) {
          const brandElem = document.querySelector('.brand-title span:first-child');
          if (brandElem) brandElem.textContent = sett.STORE_NAME;
        }

        // 2. 處理商品
        if (prodRes.status === 'fulfilled' && prodRes.value && prodRes.value.success && Array.isArray(prodRes.value.data) && prodRes.value.data.length > 0) {
          allProducts = prodRes.value.data;

          // 寫入快取，供下次秒開
          try {
            sessionStorage.setItem('cached_catalog_data', JSON.stringify({
              products: allProducts,
              settings: sett
            }));
          } catch (e) {}

          renderProductList();
        } else {
          showNoProducts('目前連線商品整理中，敬請期待！');
        }
      } catch (err) {
        console.error('載入商品清單失敗:', err);
        document.getElementById('skeletonLoader').style.display = 'none';
        if (!allProducts || allProducts.length === 0) {
          showNoProducts('網路連線逾時，請重新整理頁面！');
        }
      }
    }

    // 取得可靠的主圖片網址
    function getSafeImageUrl(rawUrl) {
      const fallback = 'https://images.unsplash.com/photo-1553062407-98eeb64c6a62?w=800&auto=format&fit=crop&q=80';
      if (!rawUrl) return fallback;
      const parts = String(rawUrl).split(/[;；,\n]/).map(s => s.trim()).filter(Boolean);
      let url = parts[0] || fallback;
      if (!url.startsWith('http')) return fallback;

      // Google Drive 轉直連
      const driveMatch = url.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/) || url.match(/\/d\/([a-zA-Z0-9_-]+)/);
      if (driveMatch && driveMatch[1]) {
        return `https://lh3.googleusercontent.com/d/${driveMatch[1]}`;
      }
      return url;
    }

    // 搜尋處理
    function handleSearch() {
      const input = document.getElementById('searchInput');
      searchKeyword = input ? input.value.trim().toLowerCase() : '';
      const clearBtn = document.getElementById('btnClearSearch');
      if (clearBtn) clearBtn.style.display = searchKeyword ? 'block' : 'none';
      renderProductList();
    }

    // 清空搜尋
    function clearSearch() {
      const input = document.getElementById('searchInput');
      if (input) {
        input.value = '';
        input.focus();
      }
      searchKeyword = '';
      const clearBtn = document.getElementById('btnClearSearch');
      if (clearBtn) clearBtn.style.display = 'none';
      renderProductList();
    }

    // 渲染商品網格
    function renderProductList() {
      const grid = document.getElementById('productGrid');
      const noResult = document.getElementById('noResultBox');
      const countText = document.getElementById('productCountText');

      grid.innerHTML = '';

      // 依關鍵字篩選 (名稱、編號、分類備註)
      const filtered = allProducts.filter(p => {
        if (!searchKeyword) return true;
        const nameMatch = (p.name || '').toLowerCase().includes(searchKeyword);
        const idMatch = (p.id || '').toLowerCase().includes(searchKeyword);
        const catMatch = (p.category || '').toLowerCase().includes(searchKeyword);
        return nameMatch || idMatch || catMatch;
      });

      countText.textContent = `共 ${filtered.length} 件連線中的商品`;

      if (filtered.length === 0) {
        grid.style.display = 'none';
        noResult.style.display = 'block';
        return;
      }

      noResult.style.display = 'none';
      grid.style.display = 'grid';

      filtered.forEach(prod => {
        const card = document.createElement('a');
        card.className = 'prod-card';
        // 點擊卡片跳轉至下單頁，帶入 p 與 uid
        const uidParam = currentUserId ? `&uid=${encodeURIComponent(currentUserId)}` : '';
        card.href = `index.html?p=${encodeURIComponent(prod.id)}${uidParam}`;

        const imgUrl = getSafeImageUrl(prod.imageUrl);
        const priceNum = Number(prod.price) || 0;
        const origPriceNum = Number(prod.originalPrice) || 0;
        const origPriceHtml = (origPriceNum > 0 && origPriceNum > priceNum) 
          ? `<span class="card-original-price">NT$ ${origPriceNum.toLocaleString()}</span>` 
          : '';

        const prodDeadline = prod.deadline ? parseDeadline(prod.deadline) : null;
        const isThisProdExpired = prodDeadline ? (new Date() >= prodDeadline) : isCatalogExpired;

        let deadlineBadgeHtml = '';
        if (prod.deadline) {
          const dlParts = prod.deadline.split(' ')[0].split('/');
          const mmdd = (dlParts.length >= 3) ? `${dlParts[1]}/${dlParts[2]}` : prod.deadline;
          deadlineBadgeHtml = `<span style="position: absolute; right: 8px; top: 8px; background: rgba(15,23,42,0.75); backdrop-filter: blur(4px); color: #fde047; padding: 3px 8px; border-radius: 6px; font-size: 11px; font-weight: 700; border: 1px solid rgba(253,224,71,0.3);">⏰ ${mmdd} 截止</span>`;
        }

        card.innerHTML = `
          <div class="prod-img-box">
            <img src="${imgUrl}" alt="${prod.name || ''}" loading="lazy" onerror="this.src='https://via.placeholder.com/300'">
            <span class="card-badge">${prod.category || '2026.10月連線'}</span>
            ${deadlineBadgeHtml}
          </div>
          <div class="card-body">
            <div class="card-title">${prod.name || '未命名商品'}</div>
            <div class="card-prices">
              <span class="card-current-price">NT$ ${priceNum.toLocaleString()}</span>
              ${origPriceHtml}
            </div>
            <div class="${isThisProdExpired ? 'btn-buy-now disabled' : 'btn-buy-now'}">${isThisProdExpired ? '🚫 已截止' : '🛒 立即下單'}</div>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function showNoProducts(msg) {
      const grid = document.getElementById('productGrid');
      const noResult = document.getElementById('noResultBox');
      grid.style.display = 'none';
      noResult.style.display = 'block';
      noResult.querySelector('p').textContent = msg;
    }
  </script>
</body>
</html>
