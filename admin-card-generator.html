<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>賣家商品建檔 & 多商品輪播推播中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary: #06c755;
      --primary-dark: #059b43;
      --accent: #ff4757;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1040px;
      margin: 0 auto;
    }

    /* 頂部標題 */
    .header {
      margin-bottom: 20px;
      text-align: center;
    }

    .badge-pro {
      display: inline-block;
      background: #0f172a;
      color: #38bdf8;
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 999px;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    /* Tab 分頁標籤 */
    .tabs-nav {
      display: flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 14px;
      margin-bottom: 20px;
      max-width: 500px;
      margin-left: auto;
      margin-right: auto;
    }

    .tab-btn {
      flex: 1;
      border: none;
      background: transparent;
      padding: 10px 16px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--text);
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* 左右雙欄佈局 */
    .grid-layout {
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 820px) {
      .grid-layout {
        grid-template-columns: 1.15fr 0.85fr;
      }
    }

    .panel {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 16px rgba(0,0,0,0.04);
    }

    .panel-title {
      font-size: 16px;
      font-weight: 800;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #475569;
      margin-bottom: 5px;
    }

    .input-text, .input-textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 14px;
      font-family: inherit;
      background: #f8fafc;
    }

    .input-text:focus, .input-textarea:focus {
      outline: none;
      border-color: var(--primary);
      background: #fff;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    /* 商品挑選清單 (Checkbox 卡片) */
    .product-select-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 480px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .product-check-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: #f8fafc;
      cursor: pointer;
      transition: all 0.2s;
    }

    .product-check-item.selected {
      border-color: var(--primary);
      background: #eefbf3;
    }

    .prod-thumb {
      width: 54px;
      height: 54px;
      border-radius: 8px;
      object-fit: cover;
      background: #cbd5e1;
      flex-shrink: 0;
    }

    .prod-info {
      flex: 1;
      min-width: 0;
    }

    .prod-name {
      font-size: 14px;
      font-weight: 700;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .prod-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .prod-price-tag {
      font-family: 'Outfit', sans-serif;
      font-size: 15px;
      font-weight: 800;
      color: var(--accent);
    }

    /* LINE 預覽視窗 (支援 Carousel 左右橫向捲動) */
    .line-chat-simulator {
      background: #849ebf;
      border-radius: 20px;
      padding: 16px;
      min-height: 440px;
      overflow-x: auto;
      display: flex;
      gap: 12px;
      align-items: flex-start;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.1);
    }

    .flex-preview-bubble {
      background: #fff;
      border-radius: 16px;
      width: 250px;
      flex-shrink: 0;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    }

    .preview-img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background: #cbd5e1;
    }

    .preview-body {
      padding: 12px;
    }

    .preview-tag {
      font-size: 10px;
      color: #059b43;
      font-weight: 700;
      background: #eefbf3;
      padding: 2px 5px;
      border-radius: 4px;
      display: inline-block;
      margin-bottom: 4px;
    }

    .preview-title {
      font-size: 14px;
      font-weight: 700;
      line-height: 1.3;
      margin-bottom: 6px;
      height: 36px;
      overflow: hidden;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .preview-price {
      font-family: 'Outfit', sans-serif;
      font-size: 17px;
      font-weight: 800;
      color: #e11d48;
    }

    .preview-footer {
      border-top: 1px solid #f1f5f9;
      padding: 8px 12px;
    }

    .preview-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      text-align: center;
      padding: 8px 0;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
    }

    /* 動作按鈕 */
    .btn-action {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 15px rgba(6, 199, 85, 0.35);
      transition: all 0.2s;
    }

    .btn-action:active {
      transform: scale(0.98);
      background: var(--primary-dark);
    }

    .btn-secondary {
      background: #334155;
      box-shadow: 0 4px 12px rgba(51, 65, 85, 0.2);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <span class="badge-pro">SELLER HUB</span>
      <h1 style="font-size: 22px; font-weight: 900;">連線代購管理中心</h1>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 3px;">電腦商品建檔 ➔ 手機勾選多樣商品打包發布到 LINE 群組</p>
    </div>

    <!-- 功能切換 Tab -->
    <div class="tabs-nav">
      <button type="button" class="tab-btn active" onclick="switchTab('tabPublish')">📱 勾選商品發群組 (多選輪播)</button>
      <button type="button" class="tab-btn" onclick="switchTab('tabCreate')">💻 電腦快速建檔</button>
    </div>

    <!-- ================= 分頁 1：勾選商品 ➔ 發送輪播卡片 (手機/電腦皆可看) ================= -->
    <div id="tabPublish" class="tab-content active">
      <div class="grid-layout">
        <!-- 左側：商品勾選列表 -->
        <div class="panel">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
            <div class="panel-title" style="margin-bottom: 0;">📦 選擇要推播的商品 (可選 1~10 件)</div>
            <button type="button" style="font-size: 12px; color: var(--primary-dark); background: none; border: none; cursor: pointer; font-weight: 700;" onclick="refreshProductList()">🔄 重新整理</button>
          </div>
          
          <div id="loadingBox" style="text-align: center; padding: 30px; color: var(--text-muted); font-size: 14px;">正在從 Google 試算表載入商品...</div>
          <div class="product-select-list" id="productListContainer"></div>

          <button type="button" class="btn-action" id="btnShareBatch" onclick="shareBatchCarousel()">
            <span id="shareBtnText">🚀 一鍵打包推播至 LINE 群組 (已選 0 件)</span>
          </button>
        </div>

        <!-- 右側：即時 Carousel 輪播預覽 -->
        <div>
          <div class="panel-title">📱 LINE 輪播卡片預覽 (可橫向滑動)</div>
          <div class="line-chat-simulator" id="carouselPreview">
            <!-- 輪播 Bubble 預覽由 JS 動態生成 -->
          </div>
        </div>
      </div>
    </div>

    <!-- ================= 分頁 2：電腦快速建檔 (寫入 Google 試算表) ================= -->
    <div id="tabCreate" class="tab-content">
      <div class="panel" style="max-width: 650px; margin: 0 auto;">
        <div class="panel-title">📝 新增商品至 Google 試算表商品庫</div>
        
        <div class="row-2">
          <div class="form-group">
            <label class="form-label">自訂商品編號 (選填，如 P003)</label>
            <input type="text" id="newProdId" class="input-text" placeholder="留空自動產生">
          </div>
          <div class="form-group">
            <label class="form-label">活動分類標籤</label>
            <input type="text" id="newProdCategory" class="input-text" value="連線熱銷">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">商品名稱 *</label>
          <input type="text" id="newProdName" class="input-text" placeholder="例：日本專櫃限量 帆布手提托特包">
        </div>

        <div class="row-2">
          <div class="form-group">
            <label class="form-label">連線特價 (NT$) *</label>
            <input type="number" id="newProdPrice" class="input-text" placeholder="例：980">
          </div>
          <div class="form-group">
            <label class="form-label">專櫃原價 (NT$)</label>
            <input type="number" id="newProdOriginalPrice" class="input-text" placeholder="例：1280">
          </div>
        </div>

        <div class="row-2">
          <div class="form-group">
            <label class="form-label">現貨/名額庫存</label>
            <input type="number" id="newProdStock" class="input-text" value="10">
          </div>
          <div class="form-group">
            <label class="form-label">規格款式 (用逗號隔開)</label>
            <input type="text" id="newProdSpecs" class="input-text" placeholder="例：米白色, 經典黑, 卡其色">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">商品圖片網址 (URL，必須以 https:// 開頭) *</label>
          <input type="url" id="newProdImage" class="input-text" placeholder="https://...">
        </div>

        <div class="form-group">
          <label class="form-label">商品短描述</label>
          <textarea id="newProdDesc" class="input-textarea" rows="2" placeholder="日本專櫃直購，輕便好收納！"></textarea>
        </div>

        <button type="button" class="btn-action btn-secondary" id="btnSaveProduct" onclick="saveNewProduct()">
          <span>💾 儲存並同步至 Google 試算表</span>
        </button>
      </div>
    </div>

  </div>

  <script>
    const CONFIG = {
      LIFF_ID: '2011732923-rcjz7Igd',
      GAS_API_URL: 'https://script.google.com/macros/s/AKfycbzz5Upj-2ho-n6kdWqffD3a0B6xNki6FYjwrQP7RVDP9d41PALA-6JVZeeC1CnJn7ZG/exec'
    };

    let allProducts = [];
    let selectedProductIds = new Set();

    window.onload = async () => {
      await initLiff();
      await fetchProductList();
    };

    async function initLiff() {
      try {
        await liff.init({ liffId: CONFIG.LIFF_ID });
      } catch (err) {
        console.error('LIFF 初始化:', err);
      }
    }

    // 1. Tab 切換
    function switchTab(tabId) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      
      event.target.classList.add('active');
      document.getElementById(tabId).classList.add('active');
    }

    // 2. 從 GAS 載入商品清單
    async function fetchProductList() {
      const container = document.getElementById('productListContainer');
      const loading = document.getElementById('loadingBox');
      loading.style.display = 'block';
      container.innerHTML = '';

      try {
        const res = await fetch(`${CONFIG.GAS_API_URL}?action=getProducts`);
        const json = await res.json();
        loading.style.display = 'none';

        if (json.success && json.data.length > 0) {
          allProducts = json.data;
          renderProductCheckboxes();
          // 預設選取前 1~2 個商品
          if (allProducts.length > 0) toggleSelectProduct(allProducts[0].id);
          if (allProducts.length > 1) toggleSelectProduct(allProducts[1].id);
        } else {
          container.innerHTML = '<div style="text-align:center; padding:30px; color:#94a3b8;">目前沒有上架中的商品，請切換至「電腦快速建檔」新增！</div>';
        }
      } catch (e) {
        loading.style.display = 'none';
        container.innerHTML = '<div style="text-align:center; color:#ef4444; padding:20px;">載入商品失敗，請重整！</div>';
      }
    }

    function refreshProductList() {
      fetchProductList();
    }

    // 3. 渲染勾選清單
    function renderProductCheckboxes() {
      const container = document.getElementById('productListContainer');
      container.innerHTML = '';

      allProducts.forEach(prod => {
        const isChecked = selectedProductIds.has(prod.id);
        const item = document.createElement('div');
        item.className = `product-check-item ${isChecked ? 'selected' : ''}`;
        item.id = `item_${prod.id}`;
        item.onclick = () => toggleSelectProduct(prod.id);

        item.innerHTML = `
          <input type="checkbox" style="transform: scale(1.2); pointer-events: none;" ${isChecked ? 'checked' : ''}>
          <img class="prod-thumb" src="${prod.imageUrl || 'https://via.placeholder.com/80'}" alt="">
          <div class="prod-info">
            <div class="prod-name">${prod.name}</div>
            <div class="prod-sub">${prod.id} ｜ 庫存: ${prod.stock} ｜ ${(prod.specs || []).join('、')}</div>
          </div>
          <div class="prod-price-tag">NT$ ${prod.price.toLocaleString()}</div>
        `;
        container.appendChild(item);
      });
      updateCarouselPreview();
    }

    // 4. 切換選取商品
    function toggleSelectProduct(prodId) {
      if (selectedProductIds.has(prodId)) {
        selectedProductIds.delete(prodId);
      } else {
        if (selectedProductIds.size >= 10) {
          alert('⚠️ LINE 輪播卡片單次上限為 10 件商品！');
          return;
        }
        selectedProductIds.add(prodId);
      }

      // 更新樣式
      const elem = document.getElementById(`item_${prodId}`);
      if (elem) {
        const isChecked = selectedProductIds.has(prodId);
        elem.classList.toggle('selected', isChecked);
        elem.querySelector('input[type="checkbox"]').checked = isChecked;
      }

      document.getElementById('shareBtnText').textContent = `🚀 一鍵打包推播至 LINE 群組 (已選 ${selectedProductIds.size} 件)`;
      updateCarouselPreview();
    }

    // 5. 更新輪播預覽視窗
    function updateCarouselPreview() {
      const preview = document.getElementById('carouselPreview');
      preview.innerHTML = '';

      const selected = allProducts.filter(p => selectedProductIds.has(p.id));

      if (selected.length === 0) {
        preview.innerHTML = '<div style="color: #fff; margin: auto; font-size: 13px;">請從左側勾選 1~10 件商品以產生輪播卡片</div>';
        return;
      }

      selected.forEach(prod => {
        const bubble = document.createElement('div');
        bubble.className = 'flex-preview-bubble';
        bubble.innerHTML = `
          <img class="preview-img" src="${prod.imageUrl || 'https://via.placeholder.com/300'}" alt="">
          <div class="preview-body">
            <span class="preview-tag">${prod.category || '連線好物'}</span>
            <div class="preview-title">${prod.name}</div>
            <div class="preview-price">NT$ ${prod.price.toLocaleString()}</div>
          </div>
          <div class="preview-footer">
            <div class="preview-btn">點此立即下單</div>
          </div>
        `;
        preview.appendChild(bubble);
      });
    }

    // 6. 產生單一 Bubble JSON
    function createBubbleJson(prod) {
      const targetOrderUrl = `https://liff.line.me/${CONFIG.LIFF_ID}?p=${encodeURIComponent(prod.id)}`;

      return {
        type: 'bubble',
        size: 'micro',
        hero: {
          type: 'image',
          url: prod.imageUrl || 'https://via.placeholder.com/400',
          size: 'full',
          aspectRatio: '20:13',
          aspectMode: 'cover'
        },
        body: {
          type: 'box',
          layout: 'vertical',
          spacing: 'xs',
          paddingAll: '12px',
          contents: [
            {
              type: 'text',
              text: prod.category || '連線特惠',
              weight: 'bold',
              color: '#059b43',
              size: 'xxs'
            },
            {
              type: 'text',
              text: prod.name,
              weight: 'bold',
              size: 'sm',
              wrap: true,
              maxLines: 2
            },
            {
              type: 'box',
              layout: 'baseline',
              spacing: 'sm',
              contents: [
                {
                  type: 'text',
                  text: `NT$ ${prod.price}`,
                  size: 'md',
                  color: '#e11d48',
                  weight: 'bold',
                  flex: 0
                },
                {
                  type: 'text',
                  text: `NT$ ${prod.originalPrice || prod.price}`,
                  size: 'xxs',
                  color: '#94a3b8',
                  decoration: 'line-through'
                }
              ]
            }
          ]
        },
        footer: {
          type: 'box',
          layout: 'vertical',
          paddingAll: '8px',
          contents: [
            {
              type: 'button',
              action: {
                type: 'uri',
                label: '🛒 立即下單',
                uri: targetOrderUrl
              },
              style: 'primary',
              color: '#06c755',
              height: 'sm'
            }
          ]
        }
      };
    }

    // 7. 發送輪播商品卡 (支援 1~10 件)
    async function shareBatchCarousel() {
      if (selectedProductIds.size === 0) {
        alert('請至少勾選 1 件要推播的商品！');
        return;
      }

      if (!liff.isLoggedIn()) {
        liff.login();
        return;
      }

      const selected = allProducts.filter(p => selectedProductIds.has(p.id));
      const bubbles = selected.map(p => createBubbleJson(p));

      // 構建 Flex Message (單品用 bubble，多品用 carousel)
      const flexPayload = {
        type: 'flex',
        altText: `【連線代購】今日主打 ${selected.length} 件精選好物推薦！`,
        contents: selected.length === 1 ? bubbles[0] : {
          type: 'carousel',
          contents: bubbles
        }
      };

      try {
        const res = await liff.shareTargetPicker([flexPayload]);
        if (res) {
          alert(`🎉 成功將 ${selected.length} 件輪播商品卡推播至指定群組！`);
        }
      } catch (err) {
        console.error('發送失敗:', err);
        alert('發送時發生錯誤：' + (err.message || JSON.stringify(err)));
      }
    }

    // 8. 電腦快速建檔：新增商品至 Google 試算表
    async function saveNewProduct() {
      const name = document.getElementById('newProdName').value.trim();
      const price = document.getElementById('newProdPrice').value.trim();
      const origPrice = document.getElementById('newProdOriginalPrice').value.trim();
      const customId = document.getElementById('newProdId').value.trim();
      const category = document.getElementById('newProdCategory').value.trim();
      const stock = document.getElementById('newProdStock').value.trim();
      const specs = document.getElementById('newProdSpecs').value.trim();
      const imageUrl = document.getElementById('newProdImage').value.trim();
      const desc = document.getElementById('newProdDesc').value.trim();

      if (!name || !price || !imageUrl) {
        alert('請務必填寫「商品名稱」、「特價」以及「商品圖片網址」！');
        return;
      }

      if (!imageUrl.startsWith('https://')) {
        alert('LINE 要求圖片網址必須以 https:// 開頭！');
        return;
      }

      const saveBtn = document.getElementById('btnSaveProduct');
      saveBtn.disabled = true;
      saveBtn.textContent = '儲存商品至試算表中...';

      const payload = {
        action: 'addProduct',
        data: {
          id: customId,
          name: name,
          category: category,
          price: Number(price),
          originalPrice: origPrice ? Number(origPrice) : Number(price),
          stock: Number(stock) || 10,
          specs: specs,
          imageUrl: imageUrl,
          description: desc
        }
      };

      try {
        const res = await fetch(CONFIG.GAS_API_URL, {
          method: 'POST',
          body: JSON.stringify(payload)
        });
        const result = await res.json();

        if (result.success) {
          alert('🎉 商品建檔成功！已即時寫入 Google 試算表！');
          // 清空表單
          document.getElementById('newProdName').value = '';
          document.getElementById('newProdPrice').value = '';
          document.getElementById('newProdOriginalPrice').value = '';
          document.getElementById('newProdId').value = '';
          document.getElementById('newProdImage').value = '';
          document.getElementById('newProdSpecs').value = '';
          document.getElementById('newProdDesc').value = '';
          
          // 切換回推播頁面並自動重新整理
          switchTab('tabPublish');
          document.querySelectorAll('.tab-btn')[0].classList.add('active');
          document.querySelectorAll('.tab-btn')[1].classList.remove('active');
          await fetchProductList();
        } else {
          alert('儲存失敗：' + result.message);
        }
      } catch (err) {
        alert('連線失敗，請檢查網路！');
      } finally {
        saveBtn.disabled = false;
        saveBtn.textContent = '💾 儲存並同步至 Google 試算表';
      }
    }
  </script>
</body>
</html>
