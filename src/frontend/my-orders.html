<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>連線訂購清單中心</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <style>
    :root {
      --primary: #06c755;
      --primary-dark: #059b43;
      --accent: #e11d48;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      padding: 14px;
      padding-bottom: 50px;
      line-height: 1.5;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
    }

    /* 頂部買家卡片 */
    .user-profile-header {
      background: #ffffff;
      border-radius: var(--radius);
      padding: 14px 16px;
      margin-bottom: 16px;
      border: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.03);
    }

    .user-avatar {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #e2e8f0;
    }

    .user-meta {
      flex: 1;
      min-width: 0;
    }

    .user-name {
      font-size: 15px;
      font-weight: 800;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .user-sub {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    .btn-top-catalog {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 700;
      color: #2563eb;
      background: #eff6ff;
      padding: 7px 12px;
      border-radius: 10px;
      text-decoration: none;
      border: 1px solid #bfdbfe;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .btn-top-catalog:active {
      transform: scale(0.96);
      background: #dbeafe;
    }

    /* Tab 切換導航 */
    .tab-nav {
      display: flex;
      background: #e2e8f0;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .tab-btn {
      flex: 1;
      text-align: center;
      padding: 8px 12px;
      font-size: 13px;
      font-weight: 700;
      border: none;
      background: none;
      color: var(--text-muted);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn.active {
      background: #ffffff;
      color: var(--text-main);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .badge-count {
      display: inline-block;
      background: var(--accent);
      color: #ffffff;
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 10px;
      margin-left: 4px;
    }

    /* 卡片通用區塊 */
    .section-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.02);
    }

    .section-title {
      font-size: 15px;
      font-weight: 800;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-main);
    }

    .section-title::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 16px;
      background: var(--primary);
      border-radius: 2px;
    }

    /* 採購狀態徽章 */
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 11px;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 20px;
      white-space: nowrap;
    }
    .badge-pending {
      background: #eff6ff;
      color: #2563eb;
      border: 1px solid #bfdbfe;
    }
    .badge-success {
      background: #ecfdf5;
      color: #059669;
      border: 1px solid #a7f3d0;
    }
    .badge-danger {
      background: #fef2f2;
      color: #dc2626;
      border: 1px solid #fecaca;
    }
    .badge-purple {
      background: #f5f3ff;
      color: #7c3aed;
      border: 1px solid #ddd6fe;
    }
    .badge-info {
      background: #f0fdfa;
      color: #0d9488;
      border: 1px solid #99f6e4;
    }

    /* 歷史訂單標籤 */
    .badge-status {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 6px;
    }
    .status-unpaid { background: #fee2e2; color: #ef4444; }
    .status-checking { background: #fef3c7; color: #d97706; }
    .status-paid { background: #dcfce7; color: #15803d; }
  </style>
</head>
<body>

  <div class="container">
    <!-- 買家身分簡介卡 -->
    <div class="user-profile-header">
      <img id="userAvatar" class="user-avatar" src="https://via.placeholder.com/44" alt="頭像">
      <div class="user-meta">
        <div class="user-name">
          <span id="displayUserName">LINE 買家</span>
          <span style="font-size: 11px; font-weight: normal; color: #10b981; background: #eefbf3; padding: 2px 6px; border-radius: 4px;">連線會員</span>
        </div>
        <div class="user-sub" id="displayUserSub">正在連線會員歸戶資料...</div>
      </div>
      <a href="catalog.html" class="btn-top-catalog" id="topCatalogLink">
        🛍️ 商品清單
      </a>
    </div>

    <!-- 功能頁籤 -->
    <div class="tab-nav">
      <button type="button" class="tab-btn active" id="tabBtnCheckout" onclick="switchMainTab('tabCheckout')">
        📦 訂購清單 <span class="badge-count" id="pendingCountBadge" style="display:none;">0</span>
      </button>
      <button type="button" class="tab-btn" id="tabBtnHistory" onclick="switchMainTab('tabHistory')">
        📜 歷史訂單查詢
      </button>
    </div>

    <!-- ================= 頁籤 1：📦 訂購清單 (僅提供本次連線採購清單) ================= -->
    <div id="tabCheckout" style="display: block;">
      
      <!-- 1. 本次連線採購清單主卡片 -->
      <div class="section-card">
        <div class="section-title">🛍️ 本次連線採購清單</div>
        
        <div id="pendingItemsContainer">
          <div style="text-align: center; padding: 24px; color: var(--text-muted); font-size: 13px;">正在載入您的連線商品...</div>
        </div>

        <!-- 合計金額統計行 -->
        <div class="subtotal-row" id="goodsSubtotalRow" style="display: none; justify-content: space-between; align-items: center; padding: 14px 0 4px 0; border-top: 1.5px dashed var(--border-color); margin-top: 12px;">
          <span style="font-weight: 700; color: #334155; font-size: 14px;">登記商品合計 (<span id="totalItemsCountText">0</span> 件)</span>
          <span style="font-family:'Outfit',sans-serif; color:var(--accent); font-size:20px; font-weight: 900;" id="goodsSubtotalText">NT$ 0</span>
        </div>
      </div>

      <!-- 如果沒有登記商品時顯示提示 -->
      <div id="noPendingBox" style="display: none; text-align: center; padding: 40px 20px; background: #fff; border-radius: var(--radius); border: 1px dashed var(--border-color); margin-bottom: 16px;">
        <div style="font-size: 40px; margin-bottom: 12px;">🛍️</div>
        <div style="font-weight: 800; color: #1e293b; font-size: 16px;">目前尚無連線訂購中的商品！</div>
        <p style="font-size: 13px; color: #64748b; margin-top: 6px; line-height: 1.6;">您可以在群組中登記喜歡商品，若沒有看到想要的商品也能到群組中用圖片許願！</p>
        <a href="catalog.html" id="emptyCatalogBtn" style="display: inline-block; margin-top: 16px; background: var(--primary); color: #fff; font-weight: 700; font-size: 14px; padding: 10px 22px; border-radius: 12px; text-decoration: none;">👉 前往連線商品清單</a>
      </div>

      <!-- 2. 連線採購進度與出貨須知說明卡片 -->
      <div class="section-card" id="procureGuideCard" style="display: none; background: #f8fafc; border: 1px solid #e2e8f0;">
        <div style="font-weight: 800; font-size: 14px; color: #1e293b; margin-bottom: 12px; display: flex; align-items: center; gap: 6px;">
          📌 連線狀態說明
        </div>
        <div style="font-size: 12.5px; color: #475569; line-height: 1.8;">
          <div style="margin-bottom: 8px;">
            <b>• ⏳ 連線登記中：</b>正在當地現場採購中
          </div>
          <div style="margin-bottom: 8px;">
            <b>• 🎉 採購成功：</b>已完成採買
          </div>
          <div style="margin-bottom: 8px;">
            <b>• ⚠️ 缺貨斷貨：</b>已無庫存或斷貨
          </div>
          <div style="margin-bottom: 8px;">
            <b>• 🛒 通知結帳：</b>已聯繫、發專屬結帳賣場
          </div>
          <div>
            <b>• 🚚 已完成出貨：</b>包裹已寄出，請留意取件通知
          </div>
        </div>

        <!-- 底部前往商品清單按鈕 -->
        <div style="margin-top: 18px;">
          <a href="catalog.html" id="btnContinueShoppingOrders" style="display: block; width: 100%; box-sizing: border-box; background: var(--primary); color: #fff; text-align: center; padding: 13px; border-radius: 12px; font-weight: 800; font-size: 15px; text-decoration: none; box-shadow: 0 4px 12px rgba(6, 199, 85, 0.25);">
            🛍️ 繼續逛連線商品清單
          </a>
        </div>
      </div>

    </div>

    <!-- ================= 頁籤 2：歷史訂單查詢 ================= -->
    <div id="tabHistory" style="display: none;">
      <div id="historyOrdersContainer">
        <div style="text-align: center; padding: 40px; color: var(--text-muted);">正在載入歷史訂單紀錄...</div>
      </div>
    </div>

  </div>

  <script>
    const CONFIG = {
      LIFF_ID: '2011732923-rcjz7Igd',
      GAS_API_URL: 'https://script.google.com/macros/s/AKfycbzz5Upj-2ho-n6kdWqffD3a0B6xNki6FYjwrQP7RVDP9d41PALA-6JVZeeC1CnJn7ZG/exec'
    };

    let currentUserId = 'TEST_USER_999';
    let pendingOrders = [];
    let completedOrders = [];
    let customerProfile = {};
    let systemSettings = {};
    let goodsTotal = 0;

    window.onload = async () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('uid')) {
        currentUserId = urlParams.get('uid');
      }

      await initLiff();
      await fetchUserData();
    };

    async function initLiff() {
      if (!CONFIG.LIFF_ID || CONFIG.LIFF_ID.includes('YOUR_LIFF')) return;
      try {
        await liff.init({ liffId: CONFIG.LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          currentUserId = profile.userId;
          document.getElementById('userAvatar').src = profile.pictureUrl || 'https://via.placeholder.com/44';
          document.getElementById('displayUserName').textContent = profile.displayName;
        }
      } catch (e) {
        console.error('LIFF Error:', e);
      }
    }

    // 取得使用者全部資料 (連線訂購中商品、歷史訂單、客戶檔案、設定)
    async function fetchUserData() {
      try {
        const res = await fetch(`${CONFIG.GAS_API_URL}?action=getOrdersByUserId&userId=${encodeURIComponent(currentUserId)}`);
        const json = await res.json();

        if (json.success && json.data) {
          pendingOrders = json.data.pendingCheckoutOrders || [];
          completedOrders = json.data.completedOrders || [];
          customerProfile = json.data.customerProfile || {};
          systemSettings = json.data.settings || {};

          updateUserProfileUI();
          renderPendingCheckoutList();
          renderHistoryOrdersList();
        }
      } catch (err) {
        console.error('載入資料錯誤:', err);
      }
    }

    // 更新買家檔案與外部導航連結
    function updateUserProfileUI() {
      const subElem = document.getElementById('displayUserSub');
      const realName = customerProfile.realName || '';
      const phone = customerProfile.phone || '';

      if (realName || phone) {
        subElem.textContent = `${realName} ｜ ${phone}`;
      } else {
        subElem.textContent = 'LINE 連線已就緒';
      }

      // 同步更新導向 catalog.html 的按鈕帶入 uid
      const uidParam = currentUserId ? `?uid=${encodeURIComponent(currentUserId)}` : '';
      const catalogHref = `catalog.html${uidParam}`;
      
      const topLink = document.getElementById('topCatalogLink');
      if (topLink) topLink.href = catalogHref;
      
      const emptyBtn = document.getElementById('emptyCatalogBtn');
      if (emptyBtn) emptyBtn.href = catalogHref;
      
      const continueBtn = document.getElementById('btnContinueShoppingOrders');
      if (continueBtn) continueBtn.href = catalogHref;
    }

    // 根據 Google Sheets 回應的採購/出貨狀態解析徽章樣式
    function getStatusBadge(status) {
      const s = String(status || '連線登記中').trim();
      if (s.includes('成功') || s.includes('已採購') || s.includes('已買到')) {
        return `<span class="status-badge badge-success">🎉 採購成功</span>`;
      } else if (s.includes('缺貨') || s.includes('斷貨') || s.includes('買不到')) {
        return `<span class="status-badge badge-danger">⚠️ 缺貨斷貨</span>`;
      } else if (s.includes('專屬賣場') || s.includes('賣場') || s.includes('通知') || s.includes('結帳')) {
        return `<span class="status-badge badge-purple">🛒 通知結帳</span>`;
      } else if (s.includes('完成') || s.includes('出貨') || s.includes('寄出')) {
        return `<span class="status-badge badge-info">🚚 已完成出貨</span>`;
      } else {
        return `<span class="status-badge badge-pending">⏳ 連線登記中</span>`;
      }
    }

    // 渲染【📦 訂購清單】（僅提供本次連線採購清單）
    function renderPendingCheckoutList() {
      const container = document.getElementById('pendingItemsContainer');
      const subtotalRow = document.getElementById('goodsSubtotalRow');
      const noBox = document.getElementById('noPendingBox');
      const procureCard = document.getElementById('procureGuideCard');
      const badge = document.getElementById('pendingCountBadge');

      container.innerHTML = '';
      goodsTotal = 0;
      let totalQty = 0;

      if (!pendingOrders || pendingOrders.length === 0) {
        noBox.style.display = 'block';
        if (procureCard) procureCard.style.display = 'none';
        subtotalRow.style.display = 'none';
        badge.style.display = 'none';
        return;
      }

      noBox.style.display = 'none';
      if (procureCard) procureCard.style.display = 'block';
      subtotalRow.style.display = 'flex';
      badge.style.display = 'inline-block';
      badge.textContent = pendingOrders.length;

      pendingOrders.forEach(item => {
        const qty = Number(item.quantity || 1);
        const sub = Number(item.subtotal) || (Number(item.unitPrice || 0) * qty);
        goodsTotal += sub;
        totalQty += qty;

        const row = document.createElement('div');
        row.className = 'item-card';
        row.style.cssText = 'display:flex; flex-direction:column; gap:8px; padding:14px; background:#fff; border-radius:12px; border:1px solid var(--border-color); margin-bottom:12px; box-shadow: 0 1px 4px rgba(0,0,0,0.02);';
        
        row.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 10px;">
            <div style="font-weight: 800; font-size: 15px; color: var(--text-main); flex: 1; line-height: 1.4;">${item.productName || '連線好物'}</div>
            ${getStatusBadge(item.shippingStatus)}
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--text-muted); background: #f8fafc; padding: 8px 10px; border-radius: 8px;">
            <div>款式規格：<b style="color: #1e293b;">${item.spec || '標準'}</b> ｜ 數量：<b style="color: #1e293b;">${qty}</b> 件</div>
            <div style="font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 800; color: var(--accent);">NT$ ${sub.toLocaleString()}</div>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; font-size: 11px; color: #94a3b8; padding-top: 2px;">
            <span>單號：<span style="font-family:'Outfit',sans-serif;">${item.orderId || '-'}</span></span>
            <span>登記時間：${item.orderDate || '-'}</span>
          </div>
        `;
        container.appendChild(row);
      });

      document.getElementById('totalItemsCountText').textContent = totalQty;
      document.getElementById('goodsSubtotalText').textContent = `NT$ ${goodsTotal.toLocaleString()}`;
    }

    // 渲染歷史訂單清單
    function renderHistoryOrdersList() {
      const container = document.getElementById('historyOrdersContainer');
      container.innerHTML = '';

      if (!completedOrders || completedOrders.length === 0) {
        container.innerHTML = `
          <div style="text-align:center; padding:40px; color:#94a3b8; font-size:13px;">
            目前尚無歷史出貨訂單紀錄
          </div>
        `;
        return;
      }

      completedOrders.forEach(order => {
        let badgeClass = 'status-unpaid';
        if (order.paymentStatus === '已回報待對帳') badgeClass = 'status-checking';
        if (order.paymentStatus === '已付款' || order.paymentStatus === '貨到付款待出貨' || order.shippingStatus === '已完成出貨') badgeClass = 'status-paid';

        const card = document.createElement('div');
        card.className = 'section-card';
        card.innerHTML = `
          <div style="display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #f1f5f9; padding-bottom: 8px; margin-bottom: 10px;">
            <span style="font-family:'Outfit',sans-serif; font-size:12px; color:var(--text-muted); font-weight:600;">${order.orderId}</span>
            <span class="badge-status ${badgeClass}">${order.shippingStatus || order.paymentStatus || '已結案'}</span>
          </div>
          <div style="font-size: 14px; font-weight: 700; margin-bottom: 4px;">${order.productName}</div>
          <div style="font-size: 12px; color: var(--text-muted); margin-bottom: 8px;">
            規格: ${order.spec} ｜ 數量: ${order.quantity} ｜ 單價: NT$ ${Number(order.unitPrice || 0).toLocaleString()}
          </div>
          <div style="font-size: 12px; color: #475569; background: #f8fafc; padding: 8px 10px; border-radius: 8px; line-height: 1.5;">
            <div>🚚 配送備註：${order.deliveryAddress || '專屬賣場出貨'}</div>
          </div>
          <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 10px; padding-top: 8px; border-top: 1px dashed var(--border-color);">
            <span style="font-size: 11px; color: var(--text-muted);">${order.orderDate}</span>
            <span style="font-family:'Outfit',sans-serif; font-size:16px; font-weight:800; color:var(--accent);">合計 NT$ ${Number(order.totalAmount || order.subtotal || 0).toLocaleString()}</span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    // 主 Tab 切換
    function switchMainTab(tabId) {
      document.getElementById('tabCheckout').style.display = (tabId === 'tabCheckout') ? 'block' : 'none';
      document.getElementById('tabHistory').style.display = (tabId === 'tabHistory') ? 'block' : 'none';

      document.getElementById('tabBtnCheckout').classList.toggle('active', tabId === 'tabCheckout');
      document.getElementById('tabBtnHistory').classList.toggle('active', tabId === 'tabHistory');
    }
  </script>
</body>
</html>
